<!doctype html>
<html><head><meta charset="utf-8"><title>Engineer - Acme</title></head>
<body>
<h1>Apply: Engineer at Acme (mock, clean)</h1>
<!-- Every question here can be answered from the test profile exactly, and
     the one checkbox is on the test allowlist: the gate should say
     would_submit. The Submit button is never clicked by anything. -->
<form id="application" onsubmit="window.__submitted = (window.__submitted || 0) + 1; return false;">
  <label for="first_name">First Name *</label>
  <input id="first_name" name="first_name" required><br>

  <label for="email">Email *</label>
  <input id="email" name="email" type="email" required><br>

  <fieldset><legend>Are you legally authorized to work in the United States? *</legend>
    <label><input type="radio" name="auth" value="yes" required> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>

  <label for="gender">Gender</label>
  <select id="gender" name="gender">
    <option value="">Select...</option>
    <option>Male</option><option>Female</option><option>GENDER_OPTION</option>
  </select><br>

  <label for="why">Why do you want to work here?</label>
  <textarea id="why" name="why"></textarea><br>

  <input type="checkbox" id="sms" name="sms"><label for="sms">I agree to receive SMS updates</label><br>

  <button type="submit" id="submit">Submit Application</button>
</form>
</body></html>
