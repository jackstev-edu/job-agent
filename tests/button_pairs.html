<!doctype html>
<html><head><meta charset="utf-8"><title>Mock - Ashby button pairs</title>
<style>
  .ashby-application-form-field-entry { margin: 14px 0; }
  .ashby-application-form-input-yesno { display: flex; gap: 6px; }
  .ashby-application-form-input-yesno-option[aria-pressed="true"] { background: #9cf; }
  /* Ashby's hidden checkbox: zero-size, so isVisible drops it. */
  .ashby-application-form-input-yesno input { position: absolute; width: 0; height: 0; opacity: 0; }
</style></head>
<body>
<h1>Mock application (button-pair regression)</h1>

<!-- Ordinary controls, so we know the old paths still work alongside. -->
<label for="fname">First name</label> <input id="fname" name="first_name" required>

<fieldset><legend>Preferred contact method</legend>
  <label><input type="radio" name="contact" value="email"> Email</label>
  <label><input type="radio" name="contact" value="phone"> Phone</label>
</fieldset>

<!-- 1-3: copied from a live Ashby posting's markup, 9 Oct 2026. No <form>,
     buttons have no type attribute. -->
<div class="_fieldEntry_1e3gg_28 ashby-application-form-field-entry" data-field-path="q-auth"><label class="_heading_f7cvd_52 _required_f7cvd_91 _label_1e3gg_42 ashby-application-form-question-title" for="q-auth">Are you legally authorized to work in the United States?</label><div class="_container_1svni_28 _yesno_1e3gg_148  ashby-application-form-input-yesno"><button class="_container_pjyt6_1 _option_1svni_32  ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="_container_pjyt6_1 _option_1svni_32  ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" class="_input_1svni_78" tabindex="-1" name="q-auth"></div></div>

<div class="_fieldEntry_1e3gg_28 ashby-application-form-field-entry" data-field-path="q-visa"><label class="_heading_f7cvd_52 _required_f7cvd_91 _label_1e3gg_42 ashby-application-form-question-title" for="q-visa">Will you now or in the future require visa sponsorship to work in the United States?</label><div class="_container_1svni_28 _yesno_1e3gg_148  ashby-application-form-input-yesno"><button class="_container_pjyt6_1 _option_1svni_32  ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="_container_pjyt6_1 _option_1svni_32  ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" class="_input_1svni_78" tabindex="-1" name="q-visa"></div></div>

<div class="_fieldEntry_1e3gg_28 ashby-application-form-field-entry" data-field-path="q-commute"><label class="_heading_f7cvd_52 _required_f7cvd_91 _label_1e3gg_42 ashby-application-form-question-title" for="q-commute">This role requires being in the office 5 days a week. Are you able to commute to this location?"</label><div class="_container_1svni_28 _yesno_1e3gg_148  ashby-application-form-input-yesno"><button class="_container_pjyt6_1 _option_1svni_32  ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="_container_pjyt6_1 _option_1svni_32  ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" class="_input_1svni_78" tabindex="-1" name="q-commute"></div></div>

<!-- 4: not Yes/No, not required. Third button labelled only by data-option. -->
<div class="ashby-application-form-field-entry" data-field-path="q-mode"><label class="ashby-application-form-question-title" for="q-mode">Preferred working arrangement</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="remote">Remote</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="hybrid">Hybrid</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="onsite"></button><input type="checkbox" tabindex="-1" name="q-mode"></div></div>

<!-- 5: already answered "No". Re-clicking would toggle it off. -->
<div class="ashby-application-form-field-entry" data-field-path="q-prior"><label class="_required_x ashby-application-form-question-title" for="q-prior">Have you previously applied to this company?</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="true" data-option="no">No</button><input type="checkbox" tabindex="-1" name="q-prior"></div></div>

<!-- 6: trap. Option text matches FORBIDDEN_BUTTONS. -->
<div class="ashby-application-form-field-entry" data-field-path="q-terms"><label class="ashby-application-form-question-title" for="q-terms">Terms of use</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="agree">I agree</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="disagree">I disagree</button><input type="checkbox" tabindex="-1" name="q-terms"></div></div>

<!-- 7: trap. Same widget inside a real <form>; typeless buttons submit it. -->
<form id="realform" onsubmit="window.__submitted = (window.__submitted || 0) + 1; return false;">
  <div class="ashby-application-form-field-entry" data-field-path="q-relocate"><label class="ashby-application-form-question-title" for="q-relocate">Are you willing to relocate?</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="q-relocate"></div></div>
  <button id="submit">Submit Application</button>
</form>

<!-- 8: hidden group (conditional question not yet shown). Must not appear. -->
<div class="ashby-application-form-field-entry" style="display:none"><label class="ashby-application-form-question-title">Hidden follow-up</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="q-hidden"></div></div>

<!-- A stray hidden checkbox outside any group: still noise, still dropped. -->
<input type="checkbox" name="stray" tabindex="-1" style="width:0;height:0;opacity:0;position:absolute">

<script>
  // Imitates Ashby's React handler: one pressed per group, value mirrored into
  // the hidden checkbox. Counts clicks so the test can prove what was clicked.
  window.__clicks = [];
  document.querySelectorAll('.ashby-application-form-input-yesno').forEach(box => {
    box.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      window.__clicks.push(box.querySelector('input').name + ':' + btn.dataset.option);
      const wasOn = btn.getAttribute('aria-pressed') === 'true';
      box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', wasOn ? 'false' : 'true');   // Ashby toggles off
      box.querySelector('input').checked = !wasOn && btn.dataset.option === 'yes';
    }));
  });
</script>
</body></html>
