<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Voluntary self-identification (mock)</title></head>
<body>
<h1>Voluntary self-identification (mock)</h1>
<form id="f">
  <fieldset id="g">
    <legend>Do you have a disability? Please check one of the boxes below.</legend>
    <input type="checkbox" id="y" name="disability_yes"><label for="y">Yes, I have a disability, or have had one in the past</label>
    <input type="checkbox" id="n" name="disability_no"><label for="n">No, I do not have a disability and have not had one in the past</label>
    <input type="checkbox" id="d" name="disability_decline"><label for="d">I do not want to answer</label>
  </fieldset>
  LONE
  <button type="button">Save and Continue</button>
</form>
</body></html>
