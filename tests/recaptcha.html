<!doctype html>
<html><head><meta charset="utf-8"><title>Mock - invisible reCAPTCHA</title>
<style>
  /* Google's own styles for the corner badge, trimmed. */
  .grecaptcha-badge { width: 256px; height: 60px; position: fixed; bottom: 14px;
                      right: -186px; box-shadow: gray 0 0 5px; }
  iframe { border: 0; }
</style></head>
<body>
<h1>Mock application (invisible reCAPTCHA, as Greenhouse loads it)</h1>
<label for="fname">First name</label> <input id="fname" name="first_name">

<!-- What invisible reCAPTCHA leaves on every page: the badge, always visible,
     holding the anchor iframe with size=invisible, and a response textarea. -->
<div class="grecaptcha-badge" data-style="bottomright">
  <div class="grecaptcha-logo">
    <iframe title="reCAPTCHA" width="256" height="60"
            src="https://www.google.com/recaptcha/enterprise/anchor?ar=1&amp;k=TESTKEY&amp;hl=en&amp;v=test&amp;size=invisible&amp;cb=1"></iframe>
  </div>
  <div class="grecaptcha-error"></div>
  <textarea id="g-recaptcha-response" name="g-recaptcha-response"
            class="g-recaptcha-response" style="display: none;"></textarea>
</div>

<!-- The challenge frame is in the DOM from the start, parked off screen and
     visibility:hidden. Google reveals it in place when it wants a challenge;
     revealChallenge() below does the same. -->
<div id="bframe-host" style="visibility: hidden; position: absolute; width: 100%;
     top: -10000px; left: 0; right: 0; opacity: 0;">
  <div style="position: absolute; z-index: 2000000000;">
    <iframe title="recaptcha challenge expires in two minutes" width="400" height="580"
            src="https://www.google.com/recaptcha/enterprise/bframe?hl=en&amp;v=test&amp;k=TESTKEY"></iframe>
  </div>
</div>

<script>
  window.revealChallenge = () => {
    const host = document.getElementById('bframe-host');
    host.style.visibility = 'visible';
    host.style.top = '40px';
    host.style.opacity = '1';
  };
  // The older checkbox kind ("I'm not a robot"): an anchor without
  // size=invisible, sitting in the form itself.
  window.addCheckbox = () => {
    const box = document.createElement('div');
    box.className = 'g-recaptcha';
    box.innerHTML = '<iframe title="reCAPTCHA" width="304" height="78" ' +
      'src="https://www.google.com/recaptcha/api2/anchor?ar=1&k=TESTKEY&hl=en&v=test&size=normal&cb=2"></iframe>';
    document.body.appendChild(box);
  };
  window.addOtherCaptcha = () => {
    const box = document.createElement('div');
    box.className = 'captcha-box';
    box.textContent = 'Type the letters you see';
    document.body.appendChild(box);
  };
</script>
</body></html>
